services:
  - type: web
    name: cyberguard-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: cyberguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "[]"
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: cyberguard-db
    databaseName: cyberguard
    user: cyberguard
    plan: free
    region: oregon
